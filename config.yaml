# =============================================================================
# Urban Subsidence Watcher — Master Configuration
# Author: Samuel Appiah Kubi
# Programme: Copernicus Master's in Digital Earth (Erasmus Mundus)
# Institution: Paris Lodron University Salzburg
# =============================================================================

project:
  name: "Urban Subsidence Watcher"
  version: "1.0.0"
  author: "Samuel Appiah Kubi"
  description: "Self-Modelling Digital Twin for Urban Subsidence Monitoring"
  output_dir: "data"
  log_level: "INFO"

study_area:
  name: "Accra"
  country: "Ghana"
  bbox: [-0.5, 5.5, -0.1, 5.8]   # [lon_min, lat_min, lon_max, lat_max]
  utm_epsg: 32630
  grid_spacing_m: 50               # output raster resolution

sentinel1:
  platform: "Sentinel-1A,Sentinel-1B"
  product_type: "SLC"
  beam_mode: "IW"
  polarization: "VV"
  orbit_direction: "ASCENDING"
  start_date: "2019-01-01"
  end_date: "2024-01-01"
  max_results: 200
  download_dir: "data/raw/sentinel1"
  burst_id: null                   # null = auto detect

dem:
  source: "SRTM"
  resolution_m: 30
  output_path: "data/raw/dem/dem_30m.tif"
  utm_output_path: "data/processed/dem/dem_utm.tif"

preprocessing:
  orbit_type: "Precise"
  multilook_range: 4
  multilook_azimuth: 1
  pixel_spacing_m: 20
  output_dir: "data/processed/s1_coregistered"

insar:
  temporal_baseline_days: 120
  spatial_baseline_m: 200
  goldstein_alpha: 0.5
  coherence_threshold: 0.3
  unwrapping_method: "snaphu"      # snaphu | mcf
  output_dir: "data/insar"
  network_file: "data/insar/network.json"

subsidence:
  fit_seasonal: true
  n_harmonics: 2
  loss: "huber"
  huber_delta: 1.0
  output_dir: "data/subsidence"
  rate_map: "data/subsidence/rate_map.tif"
  rate_error_map: "data/subsidence/rate_error.tif"
  seasonal_amplitude_map: "data/subsidence/seasonal_amplitude.tif"
  timeseries_parquet: "data/subsidence/time_series.parquet"

features:
  channels:
    - mean_coherence
    - mean_amplitude
    - dem
    - slope
    - temporal_baseline
    - distance_to_water
    - urban_mask
    - preliminary_subsidence_rate
  n_channels: 8
  output_dir: "data/features"
  stack_path: "data/features/feature_stack.npy"
  scaler_path: "data/features/scalers.pkl"
  patch_size: 64
  stride: 32

model:
  architecture: "TinyUNet"
  in_channels: 8
  encoder_channels: [32, 64, 128, 256]
  dropout_rate: 0.2
  mc_dropout_passes: 50
  loss:
    huber_weight: 0.7
    smoothness_weight: 0.3
    huber_delta: 1.0
  training:
    epochs: 100
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001
    scheduler: "cosine"
    patience: 15
    val_split: 0.15
    test_split: 0.15
    seed: 42
    num_workers: 4
    pin_memory: true
  paths:
    output_dir: "data/models"
    unquantized: "data/models/unquantized.pt"
    history: "data/models/training_history.json"
    tensorboard: "data/logs/tensorboard"

quantization:
  method: "static_int8"
  calibration_batches: 10
  pruning_sparsity: 0.30
  onnx_opset: 17
  paths:
    quantized_int8: "data/models/quantized_int8.pt"
    pruned_quantized: "data/models/pruned_quantized.pt"
    onnx_dir: "data/models/onnx"
    tflite_dir: "data/models/tflite"
    report: "data/models/quantization_report.json"

forecast:
  horizons_years: [1, 3, 5]
  mc_passes: 50
  output_dir: "data/forecasts"

validation:
  gps_csv: null                    # path to optional GPS CSV
  n_cv_folds: 5
  buffer_km: 2.0
  temporal_holdout_years: 1
  output_dir: "data/validation"
  report_pdf: "data/validation/validation_report.pdf"

dashboard:
  hotspot_threshold_mm_year: 5.0
  output_html: "data/dashboard/index.html"
  tile_provider: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  map_center: [5.65, -0.3]
  zoom_start: 11

export:
  cog_compression: "deflate"
  geojson_path: "data/exports/hotspots.geojson"
  csv_path: "data/exports/hotspot_summary.csv"
  stac_catalog: "data/exports/stac_catalog.json"
  pdf_report: "data/exports/final_report.pdf"
  output_dir: "data/exports"

edge:
  cpu_threads: 1
  n_benchmark_runs: 100
  target_size_mb: 10
  target_latency_ms: 100
  output_json: "data/edge/edge_benchmark.json"

self_update:
  check_interval_hours: 6
  log_path: "data/self_update.log"
  auto_retrain: true
